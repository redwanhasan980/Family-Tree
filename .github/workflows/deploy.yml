name: Deploy

# Deploys the Firestore rules and indexes, then builds the production image and deploys
# `main` to the VPS after CI passes (docs/DEPLOYMENT.md). It does nothing until the
# repository variable DEPLOY_ENABLED is set to "true"; it then needs FIREBASE_DEPLOY_SA
# and the DEPLOY_* secrets.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Rules and indexes come from the repository only (OPS-05), and go out before the app
  # that depends on them. The service account needs the roles in DEPLOYMENT.md §3 Step 6.
  firestore:
    name: Deploy Firestore rules and indexes
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy rules and indexes
        env:
          FIREBASE_DEPLOY_SA: ${{ secrets.FIREBASE_DEPLOY_SA }}
          PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_DEPLOY_SA" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Set the FIREBASE_DEPLOY_SA secret and the NEXT_PUBLIC_FIREBASE_PROJECT_ID variable (docs/DEPLOYMENT.md §3 Step 6)."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-deploy.json"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_DEPLOY_SA" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" pnpm exec firebase deploy \
            --only firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive

  deploy:
    name: Build image and deploy to the VPS
    needs: firestore
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shikor
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          # Public values only: they are inlined into the browser bundle.
          build-args: |
            APP_VERSION=${{ env.SHA }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha,scope=shikor-image
          cache-to: type=gha,scope=shikor-image,mode=max

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # Short-lived workflow token, piped on stdin so the server can pull a private image.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "GHCR_USER=$GHCR_USER /opt/shikor/deploy.sh $SHA"

      - name: Check the live site
        if: vars.NEXT_PUBLIC_APP_URL != ''
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$APP_URL/api/health"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
