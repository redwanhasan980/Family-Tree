# Production stack for শিকড় (Shikor) on the VPS (DESIGN §27.4).
# deploy.sh keeps this file in sync with the repository; settings live in .env next to it.
name: shikor

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  web:
    image: ${IMAGE:-ghcr.io/redwanhasan980/shikor}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - '3000'
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
